{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}DM Remission Dashboard{% endblock %}
    </title>

    <link rel="icon"
          type="image/png"
          href="{% static 'images/favicon-32x32.png' %}">

    <link rel="stylesheet"
          href="{% static 'css/main.css' %}">
</head>

<body class="bg-light">

    <div class="container py-5"
         style="max-width: 960px;">

        <!-- Header -->
        <div class="text-center mb-4">

            <img src="{% static 'images/hospital-logo.png' %}"
                 alt="โรงพยาบาลโพนสวรรค์"
                 width="80"
                 height="80"
                 style="object-fit: contain;">

            <h3 class="mt-3 mb-1">
                DM Remission Dashboard
            </h3>

            <p class="text-muted mb-0">
                โรงพยาบาลโพนสวรรค์
            </p>

        </div>

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4 p-lg-5">

                {% block content %}{% endblock %}

            </div>

        </div>

        <div class="text-center mt-4 small text-muted">

            <a href="{% url 'privacy_policy' %}">
                Privacy Policy
            </a>

            <span class="mx-2">|</span>

            <a href="{% url 'terms_of_use' %}">
                Terms of Use
            </a>

            <div class="mt-2">
                โรงพยาบาลโพนสวรรค์
            </div>

        </div>

    </div>

</body>
</html>
